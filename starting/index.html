<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/webp" href="../assets/avatar-nihilguh.webp">
  <title>NihilGuh — Iniciando a Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="starting.css?v=11">
</head>
<body>
  <main class="broadcast" id="broadcast">
    <div class="grain" aria-hidden="true"></div>

    <header class="broadcast-head">
      <span>NIHILGUH // WONDERLAND</span>
      <span>A LIVE VAI COMEÇAR</span>
    </header>

    <section class="theater" id="theater" aria-label="Abertura ilustrada">
      <div class="stage-paper" aria-hidden="true"></div>

      <div class="scene scene-intro" data-scene="intro">
        <div class="intro-rings" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="intro-stars" aria-hidden="true">✦　·　✧　·　✦</div>
        <div class="intro-copy">
          <small>um conto antes do caos</small>
          <strong>desça pela toca</strong>
        </div>
      </div>

      <div class="scene scene-cheshire" data-scene="cheshire">
        <div class="cheshire-aura" aria-hidden="true"></div>
        <svg class="cheshire-svg" viewBox="0 0 1000 560" aria-label="Olhos e sorriso do Gato de Cheshire">
          <defs>
            <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="3.2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <clipPath id="mouthClip">
              <path d="M282 316 Q500 482 718 316 Q500 414 282 316Z"/>
            </clipPath>
          </defs>

          <g id="cheshire-eyes" class="cheshire-eyes" filter="url(#softGlow)">
            <path class="eye-shape" d="M205 205 Q315 122 427 205 Q315 281 205 205Z"/>
            <path class="eye-shape" d="M573 205 Q685 122 795 205 Q685 281 573 205Z"/>
            <ellipse class="pupil" cx="318" cy="205" rx="14" ry="45"/>
            <ellipse class="pupil" cx="682" cy="205" rx="14" ry="45"/>
            <circle class="glint" cx="323" cy="185" r="5"/>
            <circle class="glint" cx="687" cy="185" r="5"/>
          </g>

          <g id="cheshire-mouth" class="cheshire-mouth" filter="url(#softGlow)">
            <path class="mouth-cavity" d="M282 316 Q500 482 718 316 Q500 414 282 316Z"/>
            <g class="teeth" clip-path="url(#mouthClip)">
              <path d="M300 326 L340 342 L320 372Z"/>
              <path d="M344 343 L390 362 L367 397Z"/>
              <path d="M393 363 L444 384 L418 423Z"/>
              <path d="M447 385 L500 401 L474 444Z"/>
              <path d="M500 401 L553 385 L526 444Z"/>
              <path d="M556 384 L607 363 L582 423Z"/>
              <path d="M610 362 L656 343 L633 397Z"/>
              <path d="M660 342 L700 326 L680 372Z"/>
              <path class="lower" d="M350 411 L387 439 L368 399Z"/>
              <path class="lower" d="M404 438 L448 460 L426 416Z"/>
              <path class="lower" d="M456 459 L500 474 L478 430Z"/>
              <path class="lower" d="M544 459 L500 474 L522 430Z"/>
              <path class="lower" d="M596 438 L552 460 L574 416Z"/>
              <path class="lower" d="M650 411 L613 439 L632 399Z"/>
            </g>
            <path class="lip lip-top" d="M273 313 Q500 402 727 313"/>
            <path class="lip lip-bottom" d="M282 316 Q500 482 718 316"/>
          </g>
        </svg>
      </div>

      <div class="scene scene-hare" data-scene="hare">
        <div class="hare-lines" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="hare-motion" class="hare-motion">
          <div class="hare-shadow"></div>
          <svg id="hare-art" class="hare-art" viewBox="0 0 560 310" aria-label="Lebre correndo com flechas">
            <g>
              <path class="hare-ear back" d="M190 111 C161 75 150 25 176 19 C196 14 212 67 211 101"/>
              <path class="hare-ear" d="M216 105 C226 58 264 17 283 34 C304 52 271 94 244 119"/>
              <ellipse class="hare-torso" cx="310" cy="180" rx="111" ry="69"/>
              <circle class="hare-head" cx="199" cy="160" r="58"/>
              <path class="hare-muzzle" d="M147 168 Q121 182 149 194"/>
              <circle class="hare-eye" cx="180" cy="144" r="7"/>
              <circle class="hare-glint" cx="177" cy="141" r="2.4"/>
              <path id="hare-leg-a" class="hare-leg" d="M360 220 Q430 271 492 231"/>
              <path id="hare-leg-b" class="hare-leg" d="M264 219 Q193 275 123 247"/>
              <path id="hare-leg-c" class="hare-leg" d="M304 226 Q241 292 177 275"/>
              <circle class="hare-tail" cx="408" cy="153" r="31"/>
            </g>
            <g class="mouth-arrows">
              <path d="M151 179 L68 147 M151 180 L59 180 M151 181 L73 214"/>
              <path d="M68 147 l19 -3 l-11 15 M59 180 l18 -9 l-7 18 M73 214 l19 -12 l-5 19"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="scene scene-dancer" data-scene="dancer">
        <div class="forest" aria-hidden="true">
          <i></i><i></i><i></i>
          <b>✦</b><b>✧</b><b>✦</b>
        </div>
        <div id="dancer-motion" class="dancer-motion">
          <svg id="dancer-art" class="dancer-art" viewBox="0 0 420 620" aria-label="Garota-gato dançando">
            <g id="dress-back" class="dress-back"><path d="M136 294 Q210 253 284 294 L354 506 Q210 578 66 506Z"/></g>
            <g class="legs"><path d="M169 481 L159 567"/><path d="M251 481 L263 567"/><path d="M159 561 q-35 8 -53 34 h77"/><path d="M263 561 q35 8 53 34 h-77"/></g>
            <g id="dancer-torso" class="torso">
              <path class="cat-ear" d="M145 151 L158 78 L199 137 M220 137 L265 78 L276 153"/>
              <circle class="head" cx="210" cy="170" r="72"/>
              <path class="hair" d="M138 172 Q210 73 286 169 Q280 105 211 96 Q150 104 138 172Z"/>
              <path class="neck" d="M193 233 L193 263 L228 263 L228 233"/>
              <path class="bodice" d="M158 258 Q210 233 262 258 L279 342 L141 342Z"/>
              <path class="apron-top" d="M185 263 L236 263 L248 339 L172 339Z"/>
            </g>
            <g id="arm-left" class="arm arm-left"><path d="M158 279 Q93 289 66 229"/><circle cx="65" cy="226" r="9"/></g>
            <g id="arm-right" class="arm arm-right"><path d="M262 279 Q332 287 357 223"/><circle cx="358" cy="220" r="9"/></g>
            <g id="dress-front" class="dress-front">
              <path class="skirt" d="M141 329 Q210 302 279 329 L329 493 Q210 548 91 493Z"/>
              <path class="apron" d="M172 341 L248 341 L278 475 Q210 510 142 475Z"/>
              <path class="hem" d="M101 480 Q210 530 319 480"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="scene scene-bird" data-scene="bird">
        <div class="bird-stars" aria-hidden="true">·　✦　　　·　　　✧　　·</div>
        <div id="bird-motion" class="bird-motion">
          <svg class="bird-art" viewBox="0 0 500 320" aria-label="Pássaro voando">
            <path class="bird-tail" d="M170 190 L76 166 L142 208 L94 244 L190 220Z"/>
            <g id="wing-back" class="wing"><path d="M238 181 Q147 52 69 92 Q125 194 229 216Z"/></g>
            <g class="bird-body"><ellipse cx="246" cy="192" rx="92" ry="53"/><circle cx="334" cy="160" r="43"/><path class="beak" d="M371 157 L441 174 L372 187Z"/><circle class="bird-eye" cx="346" cy="150" r="5"/></g>
            <g id="wing-front" class="wing"><path d="M255 186 Q343 61 418 101 Q365 195 264 217Z"/></g>
          </svg>
        </div>
      </div>

      <div class="scene scene-rest" data-scene="rest"><span>✦</span></div>
    </section>

    <section class="subtitle-area" aria-live="polite">
      <div id="subtitle-icon" class="subtitle-icon">✦</div>
      <div class="subtitle-copy">
        <div id="subtitle-current" class="subtitle-current"></div>
        <div id="subtitle-next" class="subtitle-next"></div>
      </div>
    </section>

    <footer class="broadcast-foot">
      <span>UMA HISTÓRIA ANTES DO CAOS</span>
      <span id="audio-status">HARPY HARE</span>
    </footer>

    <aside id="debug-panel" class="debug-panel" hidden>
      <strong>SYNC</strong>
      <span><b id="debug-time">0.00</b>s</span>
      <span id="debug-scene">intro</span>
      <input id="debug-seek" type="range" min="0" max="179.6" step=".01" value="0">
    </aside>

    <audio id="harpy-audio" src="../assets/audio/harpy-hare.mp3?v=2" preload="auto" autoplay playsinline></audio>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="starting.js?v=11"></script>
</body>
</html>
