<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/webp" href="../assets/avatar-nihilguh.webp">
  <title>NihilGuh — Iniciando a Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="starting.css?v=14">

<body>
  <main class="broadcast" id="broadcast">
    <div class="grain" aria-hidden="true"></div>

    <header class="broadcast-head">
      <span>NIHILGUH // WONDERLAND</span>
      <span>A LIVE VAI COMEÇAR</span>

    <section class="theater" id="theater" aria-label="Abertura ilustrada">
      <div class="stage-paper" aria-hidden="true"></div>

      <div class="scene scene-intro" data-scene="intro">
        <div class="intro-rings" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="intro-stars" aria-hidden="true">✦　·　✧　·　✦</div>
        <div class="intro-copy">
          <small>um conto antes do caos</small>
          <strong>desça pela toca</strong>
        </div>
      </div>

      <div class="scene scene-cheshire" data-scene="cheshire">
        <div class="cheshire-aura" aria-hidden="true"></div>
        <svg class="cheshire-svg" viewBox="0 0 1000 560" aria-label="Olhos e sorriso do Gato de Cheshire">

            <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
              <feGaussianBlur stdDeviation="2.6" result="blur"/>

                values="0.74 0 0 0 0.16
                        0 0.66 0 0 0.12
                        0 0 0.92 0 0.22
                        0 0 0 0.9 0"/>

                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

            <linearGradient id="eyeIvory" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fffdf4"/>
              <stop offset="100%" stop-color="#d8d1c2"/>
            </linearGradient>

            <linearGradient id="toothIvory" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fffdf4"/>
              <stop offset="100%" stop-color="#d7d0c1"/>
            </linearGradient>

            <clipPath id="mouthClip">
              <path d="M185 306
                       C285 365 382 392 500 397
                       C618 392 715 365 815 306
                       C760 432 655 492 500 505
                       C345 492 240 432 185 306Z"/>

            <g class="pupil-wrap pupil-left">

              <ellipse class="glint" cx="322" cy="180" rx="5.5" ry="8"/>
            </g>

            <g class="pupil-wrap pupil-right">
              <ellipse class="pupil" cx="683" cy="202" rx="15" ry="51"/>
              <ellipse class="pupil-core" cx="683" cy="202" rx="6" ry="38"/>
              <ellipse class="glint" cx="688" cy="180" rx="5.5" ry="8"/>
            </g>
          </g>

          <g id="cheshire-mouth" class="cheshire-mouth" filter="url(#softGlow)">

            <g class="teeth upper-teeth" clip-path="url(#mouthClip)">

              <path d="M752 405 L714 449 L733 397Z"/>
            </g>

            <path class="lip lip-top"
              d="M178 300 C282 368 381 398 500 402 C619 398 718 368 822 300"/>
            <path class="lip lip-bottom"
              d="M185 306
                 C240 432 345 492 500 505
                 C655 492 760 432 815 306"/>

            <path class="smile-corner left-corner" d="M178 300 Q160 298 146 285"/>
            <path class="smile-corner right-corner" d="M822 300 Q840 298 854 285"/>
          </g>
        </svg>
      </div>

      <div class="scene scene-hare" data-scene="hare">
        <div class="hare-lines" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="hare-motion" class="hare-motion">
          <div class="hare-shadow"></div>

              <path class="hare-ear back" d="M190 111 C161 75 150 25 176 19 C196 14 212 67 211 101"/>

              <circle class="hare-glint" cx="177" cy="141" r="2.4"/>

      </div>

      <div class="scene scene-dancer" data-scene="dancer">
        <div class="forest" aria-hidden="true">
          <i></i><i></i><i></i>
          <b>✦</b><b>✧</b><b>✦</b>
        </div>
        <div id="dancer-motion" class="dancer-motion">
          <svg id="dancer-art" class="dancer-art" viewBox="0 0 420 620" aria-label="Garota-gato dançando">
            <g id="dress-back" class="dress-back"><path d="M136 294 Q210 253 284 294 L354 506 Q210 578 66 506Z"/></g>

            <g id="dress-front" class="dress-front">

              <path class="hem" d="M101 480 Q210 530 319 480"/>

          </svg>
        </div>
      </div>

      <div class="scene scene-bird" data-scene="bird">
        <div class="bird-stars" aria-hidden="true">·　✦　　　·　　　✧　　·</div>
        <div id="bird-motion" class="bird-motion">
          <svg class="bird-art" viewBox="0 0 500 320" aria-label="Pássaro voando">
            <path class="bird-tail" d="M170 190 L76 166 L142 208 L94 244 L190 220Z"/>
            <g id="wing-back" class="wing"><path d="M238 181 Q147 52 69 92 Q125 194 229 216Z"/></g>
            <g class="bird-body"><ellipse cx="246" cy="192" rx="92" ry="53"/><circle cx="334" cy="160" r="43"/><path class="beak" d="M371 157 L441 174 L372 187Z"/><circle class="bird-eye" cx="346" cy="150" r="5"/></g>
            <g id="wing-front" class="wing"><path d="M255 186 Q343 61 418 101 Q365 195 264 217Z"/></g>
          </svg>
        </div>
      </div>

      <div class="scene scene-rest" data-scene="rest"><span>✦</span></div>
    </section>

    <section class="subtitle-area" aria-live="polite">
      <div id="subtitle-icon" class="subtitle-icon">✦</div>
      <div class="subtitle-copy">
        <div id="subtitle-current" class="subtitle-current"></div>
        <div id="subtitle-next" class="subtitle-next"></div>
      </div>
    </section>

    <footer class="broadcast-foot">
      <span>UMA HISTÓRIA ANTES DO CAOS</span>
      <span id="audio-status">HARPY HARE</span>
    </footer>

    <aside id="debug-panel" class="debug-panel" hidden>
      <strong>SYNC</strong>
      <span><b id="debug-time">0.00</b>s</span>
      <span id="debug-scene">intro</span>
      <input id="debug-seek" type="range" min="0" max="179.6" step=".01" value="0">
    </aside>

    <audio id="harpy-audio" src="../assets/audio/harpy-hare.mp3?v=2" preload="auto" autoplay playsinline></audio>
  </main>
