name: Enhance visual assets once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enhance-assets.yml"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install anime upscaler
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pillow opencv-python-headless
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8 realesrgan==0.3.0
          mkdir -p models
          curl -L --retry 4 -o models/RealESRGAN_x4plus_anime_6B.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/RealESRGAN_x4plus_anime_6B.pth

      - name: Enhance Wonderland artwork
        run: python scripts/enhance_assets.py

      - name: Commit enhanced binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bg-wonderland.webp assets/logo-nihilguh.webp assets/hero-resting.webp assets/ramen-catboy.webp
          if git diff --cached --quiet; then
            echo "No visual changes."
          else
            git commit -m "Enhance site artwork with anime super-resolution"
            git push
          fi
