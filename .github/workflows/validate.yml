name: Validate site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check games.js
          node --check goals-api.js
          node --check site.config.js
      - name: Check Apps Script JavaScript syntax
        run: |
          cat apps-script/Code.gs apps-script/Interactions.gs apps-script/RoundEngine.gs > /tmp/backend.js
          node --check /tmp/backend.js
      - name: Check ALL_IN_ONE sync
        run: |
          python -c 'from pathlib import Path; h="/**\n * NIHILGUH — ALL IN ONE\n * Gerado de Code.gs + Interactions.gs + RoundEngine.gs.\n * Cole este arquivo inteiro no projeto Apps Script do site.\n */\n\n"; e=h+Path("apps-script/Code.gs").read_text()+"\n\n"+Path("apps-script/Interactions.gs").read_text()+"\n\n"+Path("apps-script/RoundEngine.gs").read_text()+"\n"; a=Path("apps-script/ALL_IN_ONE.gs").read_text(); assert a==e, "ALL_IN_ONE.gs is out of sync with source files"'
      - name: Check required routes
        run: |
          test -f index.html
          test -f live/index.html
          test -f play/index.html
          test -f overlay/index.html
          test -f overlay.html
          test -f apps-script/ALL_IN_ONE.gs
