name: Probe Harpy Hare timestamps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch timestamps only
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, re
          q = urllib.parse.urlencode({
              "artist_name":"Yaelokre",
              "track_name":"Harpy Hare",
              "duration":"181"
          })
          req = urllib.request.Request("https://lrclib.net/api/get?"+q, headers={"User-Agent":"NihilGuh/1.0"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          synced = data.get("syncedLyrics") or ""
          rows = []
          for line in synced.splitlines():
              m = re.match(r"\[(\d+):(\d+(?:\.\d+)?)\]", line)
              if m:
                  rows.append(int(m.group(1))*60 + float(m.group(2)))
          print("COUNT", len(rows))
          print("TIMESTAMPS", ",".join(f"{x:.2f}" for x in rows))
          PY
