name: Probe Harpy Hare sync
# trigger 2

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-harpy-sync.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch synced timestamps only
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, re
          urls = [
            "https://api.synclrc.dev/search?q=" + urllib.parse.quote("Yaelokre Harpy Hare") + "&limit=10",
            "https://lrclib.net/api/search?track_name=" + urllib.parse.quote("Harpy Hare") + "&artist_name=" + urllib.parse.quote("Yaelokre")
          ]
          for url in urls:
            print("SOURCE", url.split("/")[2])
            try:
              req = urllib.request.Request(url, headers={"User-Agent":"NihilGuh/1.0"})
              data = json.load(urllib.request.urlopen(req, timeout=30))
              rows = data.get("results", data if isinstance(data,list) else [])
              for row in rows:
                duration = row.get("duration")
                synced = (row.get("lyrics") or {}).get("synced") if isinstance(row.get("lyrics"),dict) else row.get("syncedLyrics")
                if not synced: continue
                stamps=[]
                for line in synced.splitlines():
                  m=re.match(r"\[(\d+):(\d+(?:\.\d+)?)\]",line)
                  if m: stamps.append(int(m.group(1))*60+float(m.group(2)))
                if stamps:
                  print("DURATION", duration)
                  print("FIRST20", ",".join(f"{x:.2f}" for x in stamps[:20]))
                  print("COUNT",len(stamps))
                  raise SystemExit
            except SystemExit:
              raise
            except Exception as e:
              print("ERR",repr(e))
          raise SystemExit("no synced timestamps found")
          PY
