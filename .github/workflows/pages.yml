name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild reference artwork
        shell: bash
        run: |
          set -euo pipefail
          test -d assets/reference-parts
          cat assets/reference-parts/0.txt \
              assets/reference-parts/1.txt \
              assets/reference-parts/2.txt \
              assets/reference-parts/3.txt \
              assets/reference-parts/4.txt \
              assets/reference-parts/5.txt \
              assets/reference-parts/6.txt \
            | tr -d '\n\r\t ' \
            | base64 --decode > assets/reference-design.webp
          test -s assets/reference-design.webp
          file assets/reference-design.webp

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
