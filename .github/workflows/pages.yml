name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Visual assets are committed as real WebP files.
      # Do not rebuild from base64 chunks and do not re-encode them in CI.
      - name: Verify direct visual assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path("assets/bg.webp"),
              Path("assets/logo.webp"),
              Path("assets/hero.webp"),
              Path("assets/ramen.webp"),
          ]
          for p in required:
              data = p.read_bytes()
              if len(data) < 50_000:
                  raise SystemExit(f"{p} is unexpectedly small: {len(data)} bytes")
              if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                  raise SystemExit(f"{p} is not a valid WebP")
              print(p, len(data), "bytes")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
