name: Deploy LivePix Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            LIVEPIX_CLIENT_ID
            LIVEPIX_CLIENT_SECRET
        env:
          LIVEPIX_CLIENT_ID: ${{ secrets.LIVEPIX_CLIENT_ID }}
          LIVEPIX_CLIENT_SECRET: ${{ secrets.LIVEPIX_CLIENT_SECRET }}

      - name: Test LivePix API connection
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$WORKER_URL"
          echo "Testing $WORKER_URL/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$WORKER_URL/health"

      - name: Connect site to deployed Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const workerUrl = String(process.env.WORKER_URL || '').trim().replace(/\/$/, '');
          if (!/^https:\/\//.test(workerUrl)) throw new Error('Cloudflare did not return a valid deployment URL.');
          const file = 'site.config.js';
          let source = fs.readFileSync(file, 'utf8');
          const next = source.replace(/api:\s*\{\s*base:\s*"[^"]*"\s*\}/m, `api: {\n    base: "${workerUrl}"\n  }`);
          if (next === source) throw new Error('Could not find api.base in site.config.js.');
          fs.writeFileSync(file, next);
          console.log(`Site configured with ${workerUrl}`);
          NODE

      - name: Commit Worker URL
        run: |
          if git diff --quiet -- site.config.js; then
            echo "site.config.js already points to the Worker."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.config.js
          git commit -m "Conecta checkout seguro LivePix"
          git push
