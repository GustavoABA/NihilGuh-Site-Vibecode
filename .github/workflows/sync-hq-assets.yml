name: Sync original HQ artwork

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-hq-assets.yml"

permissions:
  contents: write

concurrency:
  group: sync-hq-artwork
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image encoder
        run: python -m pip install --upgrade pillow

      - name: Fetch original generated artwork from owner Drive
        env:
          BACKEND_URL: "https://script.google.com/macros/s/AKfycbwZk4rY5yDWyGrZRAaQHfHzKnQeLc091VQSs5fehtmfpkxnHxQ32wfUUzF5jzFQMumo/exec"
        run: |
          python - <<'PY'
          import base64, io, json, os, urllib.parse, urllib.request
          from pathlib import Path
          from PIL import Image

          backend=os.environ["BACKEND_URL"]
          names=("bg","logo","hero","ramen")
          aliases={
            "bg":"bg-wonderland.webp",
            "logo":"logo-nihilguh.webp",
            "hero":"hero-resting.webp",
            "ramen":"ramen-catboy.webp",
          }

          for name in names:
              url=backend+"?"+urllib.parse.urlencode({"action":"assetSource","name":name})
              with urllib.request.urlopen(url, timeout=90) as res:
                  payload=json.loads(res.read().decode("utf-8"))
              if not payload.get("ok") or not payload.get("base64"):
                  raise RuntimeError(f"Apps Script assetSource not deployed yet for {name}: {payload}")
              raw=base64.b64decode(payload["base64"])
              declared=int(payload.get("size") or 0)
              if declared and declared != len(raw):
                  raise RuntimeError(f"size mismatch for {name}: {len(raw)} != {declared}")

              im=Image.open(io.BytesIO(raw))
              im.load()
              mode="RGBA" if im.mode in ("RGBA","LA","P") else "RGB"
              im=im.convert(mode)
              target=Path("assets")/f"{name}.webp"
              im.save(target,"WEBP",quality=96,method=6,alpha_quality=100,exact=True)
              (Path("assets")/aliases[name]).write_bytes(target.read_bytes())
              print(name, im.size, len(raw), "source bytes ->", target.stat().st_size, "webp bytes")
          PY

      - name: Bust browser cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          import re
          s=re.sub(r'assets/(bg|logo|hero|ramen)\.webp\?v=[^"\']+', r'assets/\1.webp?v=sourcehq2', s)
          p.write_text(s,encoding="utf-8")
          PY

      - name: Commit original HQ assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bg.webp assets/logo.webp assets/hero.webp assets/ramen.webp
          git add assets/bg-wonderland.webp assets/logo-nihilguh.webp assets/hero-resting.webp assets/ramen-catboy.webp index.html
          git commit -m "Use original high-resolution generated artwork" || exit 0
          git pull --rebase origin main
          git push
