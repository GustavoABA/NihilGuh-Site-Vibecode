<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" role="img" aria-labelledby="title desc">
  <title id="title">Cheshire NihilGuh</title>
  <desc id="desc">Rosto de gato roxo estilizado, com orelhas pontudas, olhos brilhantes, sorriso largo e formas angulares.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9bcff"/>
      <stop offset=".34" stop-color="#a66be0"/>
      <stop offset=".72" stop-color="#5a258e"/>
      <stop offset="1" stop-color="#2a0d43"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d5ff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#8d4dc0" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c44ff"/>
      <stop offset=".48" stop-color="#fff"/>
      <stop offset="1" stop-color="#e5b9ff"/>
    </linearGradient>
    <radialGradient id="muzzle" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#f2dbff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9d59d1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="deepGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pupil{animation:pupilMove 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .grinGlow{animation:grinPulse 1.7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      .whisker{animation:whiskerFloat 3.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      @keyframes pupilMove{0%,100%{transform:translateX(0)}30%{transform:translateX(-9px)}65%{transform:translateX(9px)}}
      @keyframes grinPulse{from{opacity:.82;transform:scaleX(.985)}to{opacity:1;transform:scaleX(1.018)}}
      @keyframes whiskerFloat{from{opacity:.62}to{opacity:.95}}
      @media (prefers-reduced-motion: reduce){.pupil,.grinGlow,.whisker{animation:none}}
    </style>
  </defs>

  <g opacity=".26" filter="url(#deepGlow)">
    <ellipse cx="350" cy="245" rx="250" ry="155" fill="#a84cff"/>
  </g>

  <!-- silhouette / fur -->
  <path d="M112 145 L72 126 L100 94 L86 44 L168 104 Q230 52 350 60 Q470 52 532 104 L614 44 L600 94 L628 126 L588 145 L646 174 L604 194 L656 226 L606 236 Q629 294 582 330 L615 346 L568 356 L584 386 L526 372 Q458 415 350 413 Q242 415 174 372 L116 386 L132 356 L85 346 L118 330 Q71 294 94 236 L44 226 L96 194 L54 174 Z" fill="url(#fur)" stroke="#160720" stroke-width="10" stroke-linejoin="round"/>

  <!-- ears -->
  <path d="M104 116 L93 47 L196 111 L158 140 Z" fill="url(#ear)" stroke="#2b103d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M596 116 L607 47 L504 111 L542 140 Z" fill="url(#ear)" stroke="#2b103d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M116 94 L109 67 L162 105 L145 116 Z" fill="#fff" opacity=".72"/>
  <path d="M584 94 L591 67 L538 105 L555 116 Z" fill="#fff" opacity=".72"/>

  <!-- forehead crown / tufts -->
  <path d="M252 86 L286 54 L309 88 L349 42 L386 91 L416 58 L445 94" fill="none" stroke="#dcb8ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".58"/>
  <path d="M247 112 Q300 82 350 92 Q402 82 453 112" fill="none" stroke="#4c1c73" stroke-width="7" stroke-linecap="round" opacity=".7"/>

  <!-- cheek tufts -->
  <path d="M140 238 L82 258 L133 276 L91 309 L157 304 L136 338 L206 318" fill="none" stroke="#d0a4ef" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".46"/>
  <path d="M560 238 L618 258 L567 276 L609 309 L543 304 L564 338 L494 318" fill="none" stroke="#d0a4ef" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".46"/>

  <!-- stripes -->
  <g fill="none" stroke="#2d0b49" stroke-width="10" stroke-linecap="round" opacity=".72">
    <path d="M168 145 Q196 127 222 125"/><path d="M153 169 Q188 151 221 150"/><path d="M532 145 Q504 127 478 125"/><path d="M547 169 Q512 151 479 150"/>
  </g>

  <!-- eyebrows -->
  <path d="M160 175 Q226 136 305 176" fill="none" stroke="#1b071e" stroke-width="15" stroke-linecap="round"/>
  <path d="M540 175 Q474 136 395 176" fill="none" stroke="#1b071e" stroke-width="15" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M150 194 Q223 152 307 190 Q267 246 181 231 Q157 224 150 194Z" fill="url(#eye)" stroke="#240a31" stroke-width="7" filter="url(#glow)"/>
  <path d="M550 194 Q477 152 393 190 Q433 246 519 231 Q543 224 550 194Z" fill="url(#eye)" stroke="#240a31" stroke-width="7" filter="url(#glow)"/>
  <ellipse class="pupil" cx="233" cy="198" rx="12" ry="31" fill="#050007"/>
  <ellipse class="pupil" cx="467" cy="198" rx="12" ry="31" fill="#050007"/>
  <ellipse cx="227" cy="183" rx="5" ry="8" fill="#fff" opacity=".9"/>
  <ellipse cx="461" cy="183" rx="5" ry="8" fill="#fff" opacity=".9"/>

  <!-- nose + muzzle -->
  <ellipse cx="350" cy="258" rx="120" ry="62" fill="url(#muzzle)"/>
  <path d="M332 244 Q350 229 368 244 L350 263 Z" fill="#f0a8d8" stroke="#2a0a30" stroke-width="6" stroke-linejoin="round"/>
  <path d="M350 262 Q332 279 314 270 M350 262 Q368 279 386 270" fill="none" stroke="#2a0a30" stroke-width="6" stroke-linecap="round"/>

  <!-- grin shadow -->
  <path class="grinGlow" d="M142 279 Q350 405 558 279 Q522 390 350 402 Q178 390 142 279Z" fill="#130317" stroke="#f7efff" stroke-width="9" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M164 291 Q350 376 536 291" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".86"/>

  <!-- upper teeth -->
  <g fill="#fff" opacity=".98">
    <path d="M180 298 L205 309 L193 339 Z"/><path d="M216 311 L244 321 L228 354 Z"/><path d="M254 323 L282 331 L266 365 Z"/><path d="M293 332 L322 337 L307 372 Z"/><path d="M335 337 L350 339 L343 374 Z"/><path d="M365 337 L394 332 L379 372 Z"/><path d="M418 331 L446 323 L434 365 Z"/><path d="M456 321 L484 311 L472 354 Z"/><path d="M495 309 L520 298 L507 339 Z"/>
  </g>
  <!-- lower teeth -->
  <g fill="#d9c7e6" opacity=".92">
    <path d="M202 354 L221 366 L210 386 Z"/><path d="M238 365 L261 374 L248 395 Z"/><path d="M278 374 L302 380 L289 401 Z"/><path d="M320 380 L343 383 L332 405 Z"/><path d="M380 380 L357 383 L368 405 Z"/><path d="M422 374 L398 380 L411 401 Z"/><path d="M462 365 L439 374 L452 395 Z"/><path d="M498 354 L479 366 L490 386 Z"/>
  </g>

  <!-- whiskers -->
  <g class="whisker" fill="none" stroke="#e6c8ff" stroke-width="5" stroke-linecap="round" opacity=".78">
    <path d="M177 259 Q106 244 43 250"/><path d="M175 279 Q96 278 34 301"/><path d="M181 299 Q113 320 59 350"/>
    <path d="M523 259 Q594 244 657 250"/><path d="M525 279 Q604 278 666 301"/><path d="M519 299 Q587 320 641 350"/>
  </g>

  <!-- chin accent -->
  <path d="M292 402 Q350 425 408 402" fill="none" stroke="#d7aff4" stroke-width="8" stroke-linecap="round" opacity=".42"/>
</svg>