    [131.24,'E eu ando com a canoa devagar'],

    [152.88,'Correnteza vem, mas não invade meu lar'],
    [156.83,'Canoa uso pra desbravar o mar'],
    [160.75,'Correnteza vem, mas não invade meu lar'],
    [164.70,'Canoa uso pra desbravar o mar'],
    [168.60,'Correnteza vem, mas não invade meu lar'],
    [172.55,'']
  ];

  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const gate = $('start-gate');
  const subtitleCurrent = $('subtitle-current');
  const subtitleNext = $('subtitle-next');
  const art = document.querySelector('.art');
  const htmlAudio = $('html-audio');

  const el = {
    skyTop: $('skyTop'), skyMid: $('skyMid'), skyLow: $('skyLow'), stars: $('stars'),
    sun: $('sun'), sunHalo: $('sun-halo'), map: $('map-world'), route: $('route-scene'), routeLine: $('route-line'),
    memories: $('memory-cards'), writing: $('writing-scene'), pencil: $('pencil'), pen: $('pen'), script: $('ink-script'),
    breath: $('breath-scene'), heart: $('heart'), shards: $('past-shards'), islands: $('horizon-islands'), storm: $('storm-back'),
    waterFar: $('wave-far'), waterMid: $('wave-mid'), waterFront: $('wave-front'), foam: $('foam'), wake: $('wake'),
    canoeWrap: $('canoe-wrap'), canoeTravel: $('canoe-travel'), canoeBob: $('canoe-bob'), paddle: $('paddle'), traveler: $('traveler'), tattoos: $('tattoos'),
    scars: $('scars'), healed: $('healed'), lantern: $('home-lantern'), shield: $('home-shield'), darkness: $('darkness'),
    darkLeft: $('dark-left'), darkRight: $('dark-right'), faith: $('faith-sigil'), faithMotion: $('faith-motion'), stormShards: $('storm-shards'), birds: $('birds'),
    endMark: $('end-mark'), notes: [...document.querySelectorAll('.note')]
  };

  let player = null;
  let ytReady = false;
  let ytPlaying = false;
  let started = false;
  let pendingStart = false;
  let ended = false;
  let virtualStart = performance.now();
  let lastCaption = -2;
  let lastMediaTime = 0;
  let lastMediaPerf = performance.now();
  let holdStart = 0;

  const clamp01 = v => Math.max(0, Math.min(1, v));
  const mix = (a,b,p) => a + (b-a)*clamp01(p);
  const smoothstep = (a,b,v) => {
    const p = clamp01((v-a)/(b-a));
    return p*p*(3-2*p);
  };
  const win = (t,a,b,fade=.35) => {
    if (t < a-fade || t > b+fade) return 0;
    if (t < a) return smoothstep(a-fade,a,t);
    if (t > b) return 1-smoothstep(b,b+fade,t);
    return 1;
  };
  const pulse = (t,speed=1,phase=0) => .5 + .5*Math.sin(t*speed+phase);
  function set(target, vars){
    if(!target) return;
    const v={...vars};
    if(target instanceof SVGElement){
      const sx=(art?.clientWidth || stage.clientWidth || 1600)/1600;
      const sy=(art?.clientHeight || stage.clientHeight || 900)/900;
      if(typeof v.x==='number') v.x*=sx;
      if(typeof v.y==='number') v.y*=sy;
    }
    gsap.set(target,v);
  }

  function captionIndexAt(t){
    let idx=-1;
    for(let i=0;i<CAPTIONS.length;i++){
      if(t>=CAPTIONS[i][0]) idx=i; else break;
    }
    return idx;
  }

  function updateLabel(t){
    const idx=captionIndexAt(t);
    if(idx===lastCaption) return;
    lastCaption=idx;
    const current=idx>=0 ? CAPTIONS[idx][1] : '';
    const next=(idx+1<CAPTIONS.length) ? CAPTIONS[idx+1][1] : '';
    gsap.killTweensOf([subtitleCurrent,subtitleNext]);
    gsap.to([subtitleCurrent,subtitleNext],{opacity:0,y:5,duration:.12,onComplete:()=>{
      subtitleCurrent.textContent=current;
      subtitleNext.textContent=next;
      gsap.fromTo(subtitleCurrent,{opacity:0,y:-5},{opacity:current?1:0,y:0,duration:.24,ease:'power2.out'});
      gsap.fromTo(subtitleNext,{opacity:0,y:-3},{opacity:next ? .22 : 0,y:0,duration:.32,ease:'power2.out'});
    }});
  }

  function renderSky(t){
    const dawn = smoothstep(MARKS.faithEnd, MARKS.fadeEnd, t);
    const deepDawn = smoothstep(MARKS.calmEnd, MARKS.fadeEnd, t);
    const darkness = win(t, MARKS.interludeEnd, MARKS.pre2End, 2.0);

    const top = `rgb(${Math.round(mix(7,30,dawn))},${Math.round(mix(19,57,dawn))},${Math.round(mix(27,65,dawn))})`;
    const mid = `rgb(${Math.round(mix(23,92,dawn))},${Math.round(mix(48,112,dawn))},${Math.round(mix(58,119,dawn))})`;
    const low = `rgb(${Math.round(mix(93,221,deepDawn))},${Math.round(mix(97,173,deepDawn))},${Math.round(mix(91,103,deepDawn))})`;
    el.skyTop.setAttribute('stop-color',top); el.skyMid.setAttribute('stop-color',mid); el.skyLow.setAttribute('stop-color',low);

    set(el.stars,{opacity:(1-dawn)*(.48+.22*pulse(t,.6))*(1-darkness*.2)});
    set(el.sun,{opacity:deepDawn*.86, y:(1-deepDawn)*70, scale:.72+deepDawn*.28, transformOrigin:'50% 50%'});
    set(el.sunHalo,{opacity:deepDawn*.45,scale:.72+deepDawn*.34,transformOrigin:'50% 50%'});
  }

  function renderIntroAndMemory(t){
    const mapA = win(t,1.2,MARKS.memoryEnd,.8);
    const routeA = win(t,MARKS.introEnd,MARKS.memoryEnd,.7);
    const p = clamp01((t-MARKS.introEnd)/(MARKS.memoryEnd-MARKS.introEnd));
    set(el.map,{opacity:mapA*.72,x:Math.sin(t*.18)*12,y:Math.cos(t*.15)*7,scale:1.01+p*.025,transformOrigin:'50% 50%'});
    set(el.route,{opacity:routeA});
    if(el.routeLine) el.routeLine.style.strokeDashoffset=String(1-smoothstep(0,.86,p));
    set(el.memories,{opacity:routeA*smoothstep(.18,.45,p),y:-smoothstep(.22,1,p)*16});
    [...el.memories.querySelectorAll('.memory-card-motion')].forEach((card,i)=>{
      set(card,{y:Math.sin(t*.55+i)*7,x:Math.cos(t*.34+i*1.7)*5,rotation:Math.sin(t*.23+i)*1.8,transformOrigin:'50% 50%'});
    });

    const noteA=routeA*smoothstep(.25,.48,p);
    set(el.notes[0],{opacity:noteA*.82,y:Math.sin(t*.4)*3});
    set(el.notes[1],{opacity:noteA*.58,y:Math.cos(t*.37)*3});
  }

  function renderWriting(t){
    const a = win(t,MARKS.memoryEnd,MARKS.pre1,.65);
    const p = clamp01((t-MARKS.memoryEnd)/(MARKS.pre1-MARKS.memoryEnd));
    set(el.writing,{opacity:a});
    const pencilOut=smoothstep(.06,.34,p);
    set(el.pencil,{opacity:a*(1-pencilOut),x:pencilOut*125,y:-pencilOut*38,rotation:pencilOut*15,transformOrigin:'50% 50%'});
    const penIn=smoothstep(.22,.40,p);
    set(el.pen,{opacity:a*penIn,x:(1-penIn)*-80+Math.sin(t*.7)*3,y:Math.sin(t*1.1)*2,rotation:Math.sin(t*.45)*1.2,transformOrigin:'50% 50%'});
    if(el.script) el.script.style.strokeDashoffset=String(1-smoothstep(.34,.82,p));
    set(el.notes[2],{opacity:a*smoothstep(.48,.64,p)*.72,scale:.96+.04*pulse(t,.8),transformOrigin:'50% 50%'});

    const breathA=win(t,MARKS.firstTurn-2.5,MARKS.pre1,.5);
    set(el.breath,{opacity:breathA});
    const local=Math.max(0,t-(MARKS.firstTurn-2.5));
    document.querySelectorAll('.breath-ring').forEach((ring,i)=>{
      const q=(local*.16+i*.22)%1;
      set(ring,{scale:.72+q*.62,opacity:breathA*(1-q)*(.34-i*.05),transformOrigin:'50% 50%'});
    });
    set(el.heart,{scale:.96+.08*pulse(t,3.2),transformOrigin:'50% 55%'});
    const discard=smoothstep(MARKS.firstTurn+3.0,MARKS.pre1-.4,t);
    [...el.shards.children].forEach((s,i)=>{
      const dir=i%2?-1:1;
      set(s,{x:dir*discard*(160+i*34),y:discard*(90+i*17)+Math.sin(t*1.7+i)*8,rotation:dir*discard*(28+i*7),opacity:breathA*(1-discard*.75)});
    });
  }

  function renderCanoe(t){
    const canoeA=smoothstep(MARKS.pre1-1.1,MARKS.pre1+.7,t);
    const endFade=1-smoothstep(MARKS.final4+3.5,MARKS.fadeEnd,t);
    const opacity=canoeA*Math.max(.10,endFade);
    set(el.canoeWrap,{opacity});

    let waveAmp=1;
    if(t<MARKS.pre1) waveAmp=.35;
    if(t>=MARKS.pre1&&t<MARKS.chorus1) waveAmp=1.05;
    else if(t<MARKS.interludeEnd) waveAmp=.70;
    else if(t<MARKS.verse2End) waveAmp=.78;
    else if(t<MARKS.pre2End) waveAmp=.92;
    else if(t<MARKS.chorus2End) waveAmp=1.12;
    else if(t<MARKS.faithEnd) waveAmp=1.26;
    else if(t<MARKS.calmEnd) waveAmp=mix(1.0,.42,smoothstep(MARKS.faithEnd,MARKS.calmEnd,t));
    else waveAmp=mix(.72,.22,smoothstep(MARKS.calmEnd,MARKS.fadeEnd,t));

    const bob=Math.sin(t*2.55)*9*waveAmp;
    const roll=Math.sin(t*1.38)*2.2*waveAmp;
    const finalTravel=smoothstep(MARKS.calmEnd,VISUAL_END,t);
    const scale=1-finalTravel*.70;
    const x=finalTravel*430;
    const y=-finalTravel*170;
    set(el.canoeWrap,{opacity});
    set(el.canoeTravel,{x,y,scale,transformOrigin:'50% 55%'});
    set(el.canoeBob,{y:bob,rotation:roll,transformOrigin:'50% 70%'});
    set(el.paddle,{rotation:Math.sin(t*2.05)*18*(1-finalTravel*.7),transformOrigin:'0% 0%'});
    set(el.traveler,{rotation:-roll*.18,y:Math.sin(t*.95)*2,transformOrigin:'50% 100%'});

    const protect=(t>=MARKS.pre1 ? .36 : .18)+.08*pulse(t,1.3);
    set(el.shield,{opacity:protect,scale:.97+.035*pulse(t,1.15),rotation:t*3.2,transformOrigin:'50% 50%'});
    set(el.lantern,{scale:1+.035*pulse(t,2.1),transformOrigin:'50% 50%'});
    set(el.wake,{opacity:canoeA*(.25+waveAmp*.25)*(1-finalTravel),x:-finalTravel*200});

    const waveSpeed=24;
    set(el.waterFar,{x:-((t*waveSpeed*.36)%210),y:Math.sin(t*.72)*8*waveAmp});
    set(el.waterMid,{x:-((t*waveSpeed*.64)%230),y:Math.sin(t*.88+1)*13*waveAmp});
    set(el.waterFront,{x:-((t*waveSpeed)%270),y:Math.sin(t*1.03+2)*17*waveAmp});
    set(el.foam,{x:-((t*30)%250),y:Math.sin(t*.93)*7*waveAmp,opacity:.18+.20*waveAmp});
  }

  function renderChorus(t){
    const c1=win(t,MARKS.pre1,MARKS.chorus1,.35);
    const c2=win(t,MARKS.pre2End,MARKS.chorus2End,.35);
    const final=win(t,MARKS.calmEnd,MARKS.fadeEnd,.45);
    const c=Math.max(c1,c2,final);
    set(el.notes[3],{opacity:c*.72,x:Math.sin(t*.42)*5});
    const surge=c*(1-smoothstep(MARKS.faithEnd,MARKS.calmEnd,t)*.6);
    set(stage,{filter:`contrast(${1+surge*.08}) saturate(${.94+surge*.13})`});
  }

  function renderInterlude(t){
    const a=win(t,MARKS.chorus1,MARKS.interludeEnd,.55);
    set(el.islands,{opacity:a*.78,x:-smoothstep(MARKS.chorus1,MARKS.interludeEnd,t)*90});
  }

  function renderVerse2(t){
    const verseA=win(t,MARKS.interludeEnd,MARKS.pre2End,.7);
    const darkIn=smoothstep(MARKS.interludeEnd+2.0,MARKS.verse2End,t);
    const heal=smoothstep(MARKS.verse2End-2.0,MARKS.pre2End-1.0,t);
    set(el.darkness,{opacity:verseA*darkIn*(1-heal*.52)});
    set(el.darkLeft,{x:-120+darkIn*120-heal*80});
    set(el.darkRight,{x:120-darkIn*120+heal*80});
    set(el.storm,{opacity:verseA*darkIn*.62,y:-12+Math.sin(t*.22)*8});
    set(el.scars,{opacity:verseA*(1-heal)});
    set(el.healed,{opacity:verseA*heal});
    set(el.notes[4],{opacity:verseA*heal*.82,y:-heal*5});
    set(el.map,{opacity:verseA*(.25+.25*(1-darkIn)),x:-smoothstep(MARKS.interludeEnd,MARKS.verse2End,t)*70});
  }

  function renderFaith(t){
    const a=win(t,MARKS.chorus2End,MARKS.faithEnd,.45);
    const p=clamp01((t-MARKS.chorus2End)/(MARKS.faithEnd-MARKS.chorus2End));
    set(el.faith,{opacity:a});
    set(el.faithMotion,{scale:.72+smoothstep(0,.32,p)*.34,rotation:-12+p*36+Math.sin(t*.42)*2,transformOrigin:'50% 50%'});
    set(el.stormShards,{opacity:a*(1-smoothstep(.68,1,p))});
    [...el.stormShards.children].forEach((shard,i)=>{
      const q=(p*1.25-i*.075);
      const hit=clamp01(q);
      const side=i%2?-1:1;
      set(shard,{x:side*(1-hit)*170,opacity:a*(1-smoothstep(.55,1,hit)),scale:.9+hit*.12});
    });
    set(el.notes[5],{opacity:a*.88,scale:.96+.05*pulse(t,1.1),transformOrigin:'50% 50%'});
    if(a>0.001) set(el.darkness,{opacity:a*(1-p)*.32});
  }

  function renderCalm(t){
    const a=win(t,MARKS.faithEnd,MARKS.calmEnd,.5);
    const p=clamp01((t-MARKS.faithEnd)/(MARKS.calmEnd-MARKS.faithEnd));
    set(el.faith,{opacity:Math.max(Number(el.faith.style.opacity)||0,a*(1-p)*.72)});
    set(el.notes[6],{opacity:a*smoothstep(.18,.50,p)*.86,y:-p*8});
    set(el.birds,{opacity:a*smoothstep(.50,.92,p)*.34});
    set(el.islands,{opacity:a*.26,y:p*9});
  }

  function renderFinal(t){
    const p=clamp01((t-MARKS.calmEnd)/(MARKS.fadeEnd-MARKS.calmEnd));
    const a=win(t,MARKS.calmEnd,MARKS.fadeEnd,.4);
    const brighten=smoothstep(.04,.78,p);
    set(el.birds,{opacity:a*brighten*.72,x:p*95,y:-p*40});
    [...el.birds.children].forEach((bird,i)=>set(bird,{y:Math.sin(t*(1.2+i*.08)+i)*5,scale:1-i*.15}));
    set(el.endMark,{opacity:smoothstep(.82,.97,p),scale:.8+p*.5,transformOrigin:'50% 50%'});
    set(el.notes[3],{opacity:a*(1-p)*.36});
    set(el.notes[6],{opacity:a*(1-p)*.44});
  }

  function renderHold(clock){
    const micro=clock*0.001;
    set(el.waterFar,{x:-((micro*12)%210),y:Math.sin(micro*.42)*3});
    set(el.waterMid,{x:-((micro*18)%230),y:Math.sin(micro*.55+1)*4});
    set(el.waterFront,{x:-((micro*24)%270),y:Math.sin(micro*.66+2)*5});
    set(el.foam,{x:-((micro*20)%250),opacity:.12});
    set(el.sunHalo,{opacity:.42+.05*Math.sin(micro*.55),scale:1.02+.02*Math.sin(micro*.43),transformOrigin:'50% 50%'});
    set(el.endMark,{opacity:.92+.08*Math.sin(micro*.8)});
  }

  function render(t){
    updateLabel(t);
    renderSky(t);
    renderIntroAndMemory(t);
    renderWriting(t);
    renderCanoe(t);
    renderChorus(t);
    renderInterlude(t);
    renderVerse2(t);
    renderFaith(t);
    renderCalm(t);
    renderFinal(t);
  }

  function virtualTime(){ return (performance.now()-virtualStart)/1000; }
  function currentTime(){
    if(useLocalAudio && Number.isFinite(htmlAudio.currentTime)){
      lastMediaTime=htmlAudio.currentTime;
      lastMediaPerf=performance.now();
      return Math.max(0,Math.min(DURATION,htmlAudio.currentTime + SYNC_OFFSET));
    }
    if(ytReady && player && typeof player.getCurrentTime==='function'){
      try{
        const n=Number(player.getCurrentTime());
        if(Number.isFinite(n)){
          lastMediaTime=n;
          lastMediaPerf=performance.now();
          return Math.max(0,Math.min(DURATION,n + SYNC_OFFSET));
        }
      }catch(_){ }
    }
    const fallback=lastMediaTime + (performance.now()-lastMediaPerf)/1000;
    return Math.max(0,Math.min(DURATION,(started?fallback:virtualTime()) + SYNC_OFFSET));
  }

  function restart(){
    ended=false; holdStart=0; lastCaption=-2; lastMediaTime=0; lastMediaPerf=performance.now(); virtualStart=performance.now();
    if(useLocalAudio){ htmlAudio.currentTime=0; htmlAudio.play().catch(()=>{}); }
    else if(player && ytReady){ try{ player.seekTo(0,true); player.unMute(); player.playVideo(); }catch(_){} }
  }

  function finish(){
    if(ended) return;
    ended=true; holdStart=performance.now();
    render(VISUAL_END);
    renderHold(0);
    if(loopMode){ setTimeout(restart,7000); }
  }

  function tick(){
    if(!started){ requestAnimationFrame(tick); return; }
    const t=currentTime();
    if(!ended){
      if(t<VISUAL_END) render(t);
      else { render(VISUAL_END); renderHold((t-VISUAL_END)*1000); updateLabel(t); }
      if(t>=DURATION-.06 || (useLocalAudio && htmlAudio.ended)) finish();
    }else{
      renderHold(performance.now()-holdStart);
    }
    requestAnimationFrame(tick);
  }

  function activate(mediaTime=0){
    if(!started){
      started=true; ended=false; gate.classList.add('hidden');
    }
    lastMediaTime=Number.isFinite(mediaTime)?mediaTime:0;
    lastMediaPerf=performance.now();
    virtualStart=performance.now()-lastMediaTime*1000;
  }

  function setGateStatus(message){
    const small=gate.querySelector('small');
    if(small) small.textContent=message;
  }

  function begin(){
    if(started) return;
    pendingStart=true;
    setGateStatus('iniciando áudio…');
    if(useLocalAudio){
      if(htmlAudio.src!==localAudioSrc) htmlAudio.src=localAudioSrc;
      htmlAudio.currentTime=0;
      const attempt=htmlAudio.play();
      if(attempt && typeof attempt.then==='function'){
        attempt.then(()=>{ activate(0); pendingStart=false; }).catch(()=>{ pendingStart=false; setGateStatus('o navegador bloqueou o áudio — clique novamente'); });
      }else { activate(0); pendingStart=false; }
    }else if(player && ytReady){
      try{ player.seekTo(0,true); player.unMute(); player.setVolume(100); player.playVideo(); }
      catch(_){ pendingStart=false; setGateStatus('não foi possível iniciar o player'); }
    }else{
      setGateStatus('carregando o player do YouTube…');
    }
  }

  gate.addEventListener('click',begin);
  gate.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); begin(); }});
  htmlAudio.addEventListener('ended',finish);
  htmlAudio.addEventListener('error',()=>{ if(useLocalAudio) setGateStatus('áudio local não pôde ser carregado'); });

  window.onYouTubeIframeAPIReady = () => {
    if(useLocalAudio || player || !window.YT?.Player) return;
    player = new YT.Player('yt-audio',{
      host:'https://www.youtube.com',
      width:'220',height:'220',videoId:params.get('video')||YOUTUBE_ID,
      playerVars:{
        autoplay:0,controls:0,disablekb:1,fs:0,iv_load_policy:3,playsinline:1,rel:0,
        enablejsapi:1,origin:location.origin,widget_referrer:location.href
      },
      events:{
        onReady:ev=>{
          ytReady=true;
          setGateStatus('clique para liberar o áudio no navegador');
          if(pendingStart || auto){
            pendingStart=true;
            try{ ev.target.seekTo(0,true); ev.target.unMute(); ev.target.setVolume(100); ev.target.playVideo(); }catch(_){ }
          }
        },
        onStateChange:ev=>{
          if(!window.YT) return;
          ytPlaying = ev.data===YT.PlayerState.PLAYING;
          if(ytPlaying){
            let mt=0; try{ mt=Number(ev.target.getCurrentTime())||0; }catch(_){ }
            activate(mt); pendingStart=false;
          }
          if(ev.data===YT.PlayerState.ENDED) finish();
        },
        onError:()=>{ ytReady=false; ytPlaying=false; pendingStart=false; setGateStatus('YouTube não liberou este áudio incorporado'); }
      }
    });
  };

  function loadYouTubeApi(){
    if(useLocalAudio || document.querySelector('script[data-youtube-iframe-api]')) return;
    const script=document.createElement('script');
    script.src='https://www.youtube.com/iframe_api';
    script.async=true;
    script.dataset.youtubeIframeApi='1';
    document.head.appendChild(script);
  }

  if(!useLocalAudio) loadYouTubeApi();
  if(auto && useLocalAudio){ begin(); }
  render(0);
  updateLabel(0);
  requestAnimationFrame(tick);
})();

  </script>
</body>
</html>
