<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NihilGuh — Jogo da Live 600×400</title>
<style>
:root{--bg:rgba(7,2,13,.95);--panel:rgba(19,7,31,.96);--purple:#b66cff;--lilac:#e6c1ff;--pink:#ff63db;--red:#ff4169;--green:#70ffa1;--muted:rgba(255,255,255,.68)}
*{box-sizing:border-box}
html,body{margin:0;width:600px;height:400px;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif}
body{display:grid;place-items:center}
#app{width:600px;height:400px;position:relative}
.frame{width:600px;height:400px;padding:20px 22px;position:relative;overflow:hidden;border:1px solid rgba(210,158,255,.46);border-radius:27px;background:radial-gradient(circle at 82% 10%,rgba(177,92,255,.2),transparent 36%),radial-gradient(circle at 12% 92%,rgba(91,39,150,.17),transparent 38%),linear-gradient(145deg,var(--bg),var(--panel));box-shadow:inset 0 0 70px rgba(0,0,0,.3),0 0 38px rgba(130,56,215,.25)}
.frame::before{content:"";position:absolute;inset:-55%;background:conic-gradient(from 0deg,transparent,rgba(203,133,255,.04),transparent 25%,rgba(126,51,210,.05),transparent 55%);animation:spin 18s linear infinite;pointer-events:none}
.frame.chaos{border-color:rgba(255,73,220,.62);box-shadow:0 0 38px rgba(255,54,213,.18),inset 0 0 55px rgba(133,33,154,.13)}
.frame.chaos::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(255,74,225,.025) 10px 11px);animation:scan .6s steps(2) infinite}
.frame.critical{border-color:rgba(255,68,103,.7);animation:criticalPulse 1s ease-in-out infinite}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative;z-index:3}
.kicker{font-size:11px;font-weight:950;letter-spacing:.2em;color:var(--lilac)}
.badges{display:flex;gap:6px;align-items:center}
.badge{font-size:10px;font-weight:950;letter-spacing:.09em;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04)}
.badge.chaos{color:#ff9aeb;border-color:rgba(255,88,221,.35)}.badge.urgent{color:#ff8da8;border-color:rgba(255,73,110,.4)}.badge.done{color:var(--green);border-color:rgba(113,255,155,.3)}
.main{position:relative;z-index:2;height:292px;display:flex;flex-direction:column;justify-content:center}
.title{font-size:35px;line-height:1.02;font-weight:950;letter-spacing:-.045em;max-width:540px;text-wrap:balance}
.explain{font-size:15px;line-height:1.42;color:var(--muted);max-width:520px;margin-top:13px}
.progress{height:9px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08);margin-top:15px}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8b3fe7,#e8b6ff);box-shadow:0 0 16px rgba(191,119,255,.5);transition:width .45s}
.progress.red i{background:linear-gradient(90deg,#c42658,#ff7294)}
.footer{position:absolute;left:22px;right:22px;bottom:18px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px}
.reward{font-weight:950;color:var(--lilac);font-size:16px}.phase-left{font-size:11px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
.timer{text-align:center;align-items:center}.timer-label{font-size:12px;font-weight:950;letter-spacing:.2em;color:var(--lilac);margin-bottom:12px}.clock{font-size:74px;line-height:1;font-weight:950;letter-spacing:-.065em;font-variant-numeric:tabular-nums;text-shadow:0 0 38px rgba(177,92,255,.28)}.timer-sub{font-size:14px;color:var(--muted);margin-top:14px}
.boss-main{align-items:center;text-align:center}.boss-face{font-size:66px;line-height:1;letter-spacing:-.14em;text-shadow:0 0 28px rgba(203,124,255,.62);margin-bottom:11px}.boss-name{font-size:27px;font-weight:950;letter-spacing:-.03em}.boss-hp{font-size:12px;color:#d8b7ef;margin-top:6px;font-weight:800}
.boss-mini{position:absolute;left:22px;right:22px;bottom:49px;z-index:3}.boss-mini-row{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.09em;color:#bfa7ce;font-weight:900}.boss-mini .progress{height:5px;margin-top:5px}
.vote-result{display:flex;gap:8px;margin-top:14px}.choice{flex:1;padding:10px;border-radius:12px;border:1px solid rgba(205,151,255,.18);background:rgba(255,255,255,.025)}.choice b,.choice small{display:block}.choice small{color:#a895b8;margin-top:4px}
#event-fx{position:absolute;inset:0;z-index:60;pointer-events:none;display:none;align-items:center;justify-content:center;overflow:hidden;border-radius:27px}
#event-fx.show{display:flex}
.fx-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(163,70,255,.42),rgba(4,1,8,.98) 70%)}
.fx-card{position:relative;z-index:3;width:88%;text-align:center;padding:26px 22px;border:1px solid rgba(226,181,255,.58);border-radius:22px;background:rgba(16,5,28,.88);box-shadow:0 0 60px rgba(164,73,255,.42)}
.fx-kicker{font-size:11px;letter-spacing:.23em;font-weight:950;color:#e9c9ff}.fx-title{font-size:38px;line-height:1;font-weight:950;letter-spacing:-.045em;margin-top:10px}.fx-sub{font-size:16px;color:#c9addc;margin-top:10px}.fx-icon{font-size:48px;margin-top:10px;filter:drop-shadow(0 0 18px rgba(220,150,255,.5))}
#event-fx.damage .fx-card{animation:damage .55s ease both}#event-fx.raid .fx-card{animation:glitch .8s steps(2)}#event-fx.livepix .fx-card{box-shadow:0 0 70px rgba(198,119,255,.58)}#event-fx.boss .fx-card{animation:bossBoom 1.2s cubic-bezier(.2,.8,.2,1)}#event-fx.urgent .fx-card{border-color:rgba(255,79,115,.8);box-shadow:0 0 70px rgba(255,50,94,.32)}
.particle{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#e8b9ff;box-shadow:0 0 12px #bc62ff;animation:particle var(--life,1s) ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{50%{transform:translateY(3px)}}@keyframes criticalPulse{50%{box-shadow:0 0 42px rgba(255,54,91,.32),inset 0 0 40px rgba(255,35,80,.08)}}@keyframes damage{20%{transform:translate(-8px,3px) rotate(-2deg)}45%{transform:translate(7px,-3px) rotate(2deg)}70%{transform:translate(-3px,1px)}100%{transform:none}}@keyframes glitch{0%,100%{transform:none;filter:none}20%{transform:translate(-8px,2px);filter:hue-rotate(35deg)}40%{transform:translate(7px,-2px)}60%{transform:skewX(-4deg)}80%{transform:translate(-3px,1px)}}@keyframes bossBoom{0%{transform:scale(.72);opacity:0}45%{transform:scale(1.12);filter:brightness(2.5)}100%{transform:scale(1);opacity:1}}@keyframes particle{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<script src="site.config.js"></script>
<script src="goals-api.js"></script>
</head>
<body>
<div id="app"></div>
<div id="event-fx"><div class="fx-bg"></div><div class="fx-card"><div class="fx-kicker" id="fx-kicker"></div><div class="fx-title" id="fx-title"></div><div class="fx-sub" id="fx-sub"></div><div class="fx-icon" id="fx-icon">◖⌣◗</div></div></div>
<script>
(() => {
  const app=document.getElementById('app'),api=window.NihilGuhAPI;
  const GOAL_MS=60*1000,TIMER_MS=30*60*1000,BOSS_MS=45*1000,REFRESH_MS=10000;
  let state=null,phase={kind:'boss',index:0,endsAt:0},phaseStarted=false,lastSession='',eventSession='',seen=new Set(),fxBusy=false,fxQueue=[];
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const clock=s=>[Math.floor(s/3600),Math.floor((s%3600)/60),Math.floor(s%60)].map(v=>String(Math.max(0,v)).padStart(2,'0')).join(':');

  function liveSeconds(){return state&&state.session?Math.max(0,Math.floor(Number(state.session.tempo_total_min||0)*60-(Date.now()-new Date(state.session.inicio).getTime())/1000)):0}
  function phaseSeconds(){return Math.max(0,Math.ceil((phase.endsAt-Date.now())/1000))}
  function game(){return state&&state.game?state.game:{}}
  function bossMini(){
    const b=game().boss||{},pct=Math.max(0,Math.min(100,Number(b.percent==null?100:b.percent)));
    return '<div class="boss-mini"><div class="boss-mini-row"><span>BOSS DA TOCA · '+esc(b.name||'CHESHIRE DO ABISMO')+'</span><span>'+esc(b.hp||0)+'/'+esc(b.maxHp||0)+' HP</span></div><div class="progress"><i style="width:'+pct+'%"></i></div></div>';
  }
  function badges(){
    const g=game(),out=[];
    if(g.chaos&&g.chaos.active) out.push('<span class="badge chaos">CAOS · '+esc(g.chaos.label)+'</span>');
    if(liveSeconds()<=10*60) out.push('<span class="badge urgent">TEMPO CRÍTICO</span>');
    return out.join('');
  }
  function frameClass(){return 'frame'+(game().chaos&&game().chaos.active?' chaos':'')+(liveSeconds()<=10*60?' critical':'')}

  function missionView(kicker,holder,red){
    const m=holder&&holder.mission?holder.mission:holder;if(!m)return '';
    const pct=Math.min(100,Math.round(Number(m.progress||0)/Math.max(1,Number(m.target||1))*100));
    const left=m.endsAt?Math.max(0,Math.ceil((new Date(m.endsAt).getTime()-Date.now())/1000)):0;
    return '<section class="'+frameClass()+'"><div class="header"><div class="kicker">'+esc(kicker)+'</div><div class="badges">'+badges()+'<span class="badge">'+clock(left)+'</span></div></div>'+
      '<div class="main"><div class="title">'+esc(m.label)+'</div><div class="explain">'+esc(m.description||'')+'</div><div class="progress '+(red?'red':'')+'"><i style="width:'+pct+'%"></i></div><div class="explain">'+esc(m.progress||0)+' / '+esc(m.target||0)+'</div></div>'+
      bossMini()+'<div class="footer"><div class="reward">'+(Number(m.rewardMinutes||0)>0?'+'+m.rewardMinutes+' MIN':'DANO NO BOSS / LOOT')+'</div><div class="phase-left">evento prioritário</div></div></section>';
  }

  function urgentView(){
    const g=game();
    if(g.ending) return '<section class="frame critical"><div class="header"><div class="kicker">A TOCA ESTÁ FECHANDO</div><div class="badges"><span class="badge urgent">FIM DA SESSÃO</span></div></div><div class="main boss-main"><div class="boss-face">◖⌣◗</div><div class="title">ATÉ A PRÓXIMA QUEDA</div><div class="explain">A Morte Súbita terminou. O relógio chegou ao fim e a sequência de encerramento foi iniciada.</div></div><div class="footer"><div class="reward">WE’RE ALL MAD HERE.</div><div class="phase-left">00:00:00</div></div></section>';
    if(g.suddenDeath&&g.suddenDeath.status==='active') return missionView('☠ MORTE SÚBITA',g.suddenDeath,true);
    if(g.lastChance&&g.lastChance.status==='active') return missionView('⚠ ÚLTIMA CHANCE',g.lastChance,true);
    if(g.communityMission&&g.communityMission.status==='active') return missionView('A TOCA ESCOLHEU',g.communityMission,false);
    if(g.randomEvent&&g.randomEvent.status==='active') return missionView('EVENTO SURPRESA',g.randomEvent,false);
    return '';
  }

  function explanation(goal){
    if(!goal)return '';
    if(goal.tipo==='visitors')return goal.alvo+' pessoas diferentes precisam acessar o site durante esta live.';
    if(goal.tipo==='growth_total')return 'Follows da Twitch/Kick e inscritos do YouTube contam juntos.';
    if(goal.tipo==='growth_twitch')return 'Novos follows detectados na Twitch.';
    if(goal.tipo==='growth_youtube')return 'Novos inscritos detectados no YouTube.';
    if(goal.tipo==='growth_kick')return 'Novos follows detectados na Kick.';
    if(goal.tipo==='support_total')return 'Subs, members, cheers, tips, Super Chats e outros apoios contam.';
    if(goal.tipo==='raid')return 'Uma raid precisa invadir a toca.';
    if(goal.tipo==='platforms')return 'A comunidade precisa movimentar múltiplas plataformas.';
    if(goal.tipo==='livepix_amount')return 'Cada R$10 completos no LivePix adicionam 1 minuto à live.';
    return 'Complete esta missão antes do fim da transmissão.';
  }

  function ensurePhase(){
    if(!state||!state.session)return;
    const id=state.session.session_id,goals=state.goals||[];
    if(id!==lastSession||!phaseStarted){lastSession=id;phaseStarted=true;phase={kind:'boss',index:0,endsAt:Date.now()+BOSS_MS};}
    if(phase.kind==='goal'&&!goals[phase.index])phase={kind:'boss',index:0,endsAt:Date.now()+BOSS_MS};
  }
  function advance(){
    const goals=state&&state.goals?state.goals:[];
    if(phase.kind==='boss') phase=goals.length?{kind:'goal',index:0,endsAt:Date.now()+GOAL_MS}:{kind:'timer',index:0,endsAt:Date.now()+TIMER_MS};
    else if(phase.kind==='goal'){const n=phase.index+1;phase=n<goals.length?{kind:'goal',index:n,endsAt:Date.now()+GOAL_MS}:{kind:'timer',index:0,endsAt:Date.now()+TIMER_MS};}
    else phase={kind:'boss',index:0,endsAt:Date.now()+BOSS_MS};
    render(true);
  }

  function render(animate){
    if(!state||!state.session||state.session.status!=='ONLINE'){app.innerHTML='';return}
    const urgent=urgentView();if(urgent){app.innerHTML=urgent;return}
    ensurePhase();const goals=state.goals||[],g=game(),anim=animate?' style="animation:bossBoom .45s ease-out"':'';
    if(phase.kind==='boss'){
      const b=g.boss||{},pct=Math.max(0,Math.min(100,Number(b.percent==null?100:b.percent)));
      app.innerHTML='<section class="'+frameClass()+'"'+anim+'><div class="header"><div class="kicker">BOSS DA TOCA</div><div class="badges">'+badges()+'<span class="badge '+(b.defeated?'done':'')+'">'+(b.defeated?'DERROTADO':pct+'% HP')+'</span></div></div>'+
        '<div class="main boss-main"><div class="boss-face">◖≋⌣≋◗</div><div class="boss-name">'+esc(b.name||'CHESHIRE DO ABISMO')+'</div><div class="boss-hp">'+esc(b.hp||0)+' / '+esc(b.maxHp||0)+' HP</div><div class="progress" style="width:82%"><i style="width:'+pct+'%"></i></div><div class="explain">Visitas, follows, subs/members, LivePix, raids e metas causam dano. Ao zerar o HP: +30 min e loot.</div></div>'+
        '<div class="footer"><div class="reward">'+(b.defeated?'A TOCA VENCEU':'OBJETIVO COLETIVO')+'</div><div class="phase-left">metas em '+clock(phaseSeconds())+'</div></div></section>';return;
    }
    if(phase.kind==='timer'){
      app.innerHTML='<section class="'+frameClass()+'"'+anim+'><div class="header"><div class="kicker">NIHILGUH // TEMPO DA TOCA</div><div class="badges">'+badges()+'<span class="badge">'+state.session.metas_batidas+'/'+state.session.metas_total+' METAS</span></div></div>'+
        '<div class="main timer"><div class="timer-label">TEMPO RESTANTE DE LIVE</div><div class="clock" id="live-clock">'+clock(liveSeconds())+'</div><div class="timer-sub">A comunidade já conquistou <b>+'+esc(state.session.tempo_ganho_min)+' min</b>.</div></div>'+
        bossMini()+'<div class="footer"><div class="reward">A toca fecha quando o relógio zerar.</div><div class="phase-left">rotação volta em <span id="phase-clock">'+clock(phaseSeconds())+'</span></div></div></section>';return;
    }
    const goal=goals[phase.index];if(!goal)return;
    const pct=Math.min(100,Math.round(Number(goal.progresso||0)/Math.max(1,Number(goal.alvo||1))*100));
    const progress=goal.tipo==='livepix_amount'?'R$ '+Number(goal.progresso||0).toFixed(2)+' / R$ '+Number(goal.alvo||0).toFixed(2):goal.progresso+'/'+goal.alvo;
    app.innerHTML='<section class="'+frameClass()+'"'+anim+'><div class="header"><div class="kicker">MISSÃO '+(phase.index+1)+' DE '+goals.length+'</div><div class="badges">'+badges()+'<span class="badge '+(goal.concluida?'done':'')+'">'+(goal.concluida?'✓ CONCLUÍDA':esc(progress))+'</span></div></div>'+
      '<div class="main"><div class="title">'+esc(goal.meta)+'</div><div class="explain">'+esc(explanation(goal))+'</div><div class="progress"><i style="width:'+(goal.concluida?100:pct)+'%"></i></div></div>'+
      bossMini()+'<div class="footer"><div class="reward">'+(goal.tipo==='livepix_amount'?'+1 MIN / R$10':'+'+esc(goal.recompensa_min)+' MIN')+'</div><div class="phase-left">próxima tela em <span id="phase-clock">'+clock(phaseSeconds())+'</span></div></div></section>';
  }

  const phrases={
    stream_growth:['Mais uma alma encontrou a toca.','O sorriso ficou um pouco maior. Bem-vindo.','Outro curioso caiu no buraco.'],
    stream_support:['A toca recebeu um apoio premium. Elegante.','Isso parece caro. O Cheshire aprovou.','Um apoio digno de outro lado do espelho.'],
    stream_raid:['As paredes estão tremendo. Uma raid invadiu a toca.','Invasores detectados. Tentem não quebrar o chá.'],
    livepix_donation:['Uma oferenda caiu na toca. O relógio agradece.','LivePix recebido. O tempo está ficando estranho.'],
    goal_complete:['Meta concluída. Vocês realmente não sabem parar.','Missão encerrada. Mais caos registrado.'],
    boss_defeated:['Boss derrotado. A toca pertence à comunidade.','Vocês quebraram o sorriso do abismo. Trinta minutos liberados.'],
    chaos_start:['Modo Caos ativado. As regras acabaram de quebrar.','O relógio enlouqueceu. Modo Caos começou.'],
    last_chance_start:['Última chance. Quinze minutos e contando.','A toca está fechando. Esta é a última chance.'],
    sudden_death_start:['Morte súbita. Uma última missão decide tudo.','Zero no relógio. Agora é sobreviver ou encerrar.'],
    combo_bonus:['Combo de metas. Vocês estão perigosamente coordenados.']
  };

  function speak(type){
    if(!('speechSynthesis'in window)||!phrases[type])return;
    try{const list=phrases[type],u=new SpeechSynthesisUtterance(list[Math.floor(Math.random()*list.length)]);u.lang='pt-BR';u.rate=.88;u.pitch=.63;u.volume=1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^pt-BR/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null;speechSynthesis.speak(u)}catch(_){}
  }
  function particles(n){
    const layer=document.getElementById('event-fx');for(let i=0;i<n;i++){const p=document.createElement('i');p.className='particle';const a=Math.random()*Math.PI*2,d=80+Math.random()*240;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');p.style.setProperty('--life',(0.6+Math.random()*1.1)+'s');layer.appendChild(p);setTimeout(()=>p.remove(),1900)}
  }
  function fxSpec(ev){
    const t=ev.type;
    if(t==='boss_damage')return {cls:'damage',k:'BOSS FERIDO',title:'-'+Math.round(ev.value||0)+' HP',sub:ev.detail||'A toca atacou.',icon:'✦',ms:1800};
    if(t==='boss_defeated')return {cls:'boss',k:'BOSS DA TOCA',title:'DERROTADO',sub:'+30 MIN · LOOT LIBERADO',icon:'◖×⌣×◗',ms:6500};
    if(t==='stream_raid')return {cls:'raid',k:'INVASÃO',title:'RAID NA TOCA',sub:ev.user||ev.detail||'Novas almas chegaram.',icon:'👁',ms:3600};
    if(t==='livepix_donation')return {cls:'livepix',k:'OFERENDA',title:'LIVEPIX',sub:ev.user?ev.user+' alimentou o caos.':'O relógio recebeu apoio.',icon:'✦',ms:3300};
    if(t==='stream_support')return {cls:'premium',k:'APOIO',title:'A TOCA CRESCEU',sub:ev.user||'Novo apoio registrado.',icon:'♛',ms:2800};
    if(t==='stream_growth')return {cls:'growth',k:'NOVO SORRISO',title:ev.user||'ALGUÉM ENTROU',sub:'A comunidade ficou maior.',icon:'◖⌣◗',ms:2300};
    if(t==='goal_complete')return {cls:'goal',k:'META CONCLUÍDA',title:ev.detail||'MISSÃO COMPLETA',sub:'O relógio foi alterado.',icon:'✓',ms:4600};
    if(t==='chaos_start')return {cls:'raid',k:'SISTEMA CORROMPIDO',title:'MODO CAOS',sub:'As regras mudaram temporariamente.',icon:'⚡',ms:4800};
    if(t==='last_chance_start')return {cls:'urgent',k:'TEMPO CRÍTICO',title:'ÚLTIMA CHANCE',sub:ev.detail||'Uma missão emergencial começou.',icon:'⚠',ms:5200};
    if(t==='sudden_death_start')return {cls:'urgent',k:'00:00:00',title:'MORTE SÚBITA',sub:ev.detail||'Uma última missão decide a live.',icon:'☠',ms:6000};
    if(t==='combo_bonus')return {cls:'goal',k:'COMBO',title:'METAS EM SEQUÊNCIA',sub:'+5 MIN DE LIVE',icon:'×2',ms:3600};
    return null;
  }
  function queueFx(ev){const spec=fxSpec(ev);if(!spec)return;fxQueue.push({ev:ev,spec:spec});playFx()}
  function playFx(){
    if(fxBusy||!fxQueue.length)return;fxBusy=true;const item=fxQueue.shift(),ev=item.ev,s=item.spec,layer=document.getElementById('event-fx');
    layer.className='show '+s.cls;document.getElementById('fx-kicker').textContent=s.k;document.getElementById('fx-title').textContent=s.title;document.getElementById('fx-sub').textContent=s.sub;document.getElementById('fx-icon').textContent=s.icon;
    if(['boss','livepix','raid','goal'].includes(s.cls))particles(s.cls==='boss'?90:35);
    speak(ev.type);setTimeout(()=>{layer.className='';fxBusy=false;setTimeout(playFx,300)},s.ms);
  }
  function seenKey(id){return'nihilguh_overlay_events_'+id}
  function detectEvents(next){
    const id=next&&next.session?next.session.session_id:'';if(!id)return;
    const events=next.game&&next.game.recentEvents?next.game.recentEvents:[];
    if(id!==eventSession){eventSession=id;fxQueue=[];fxBusy=false;let stored=[];try{stored=JSON.parse(localStorage.getItem(seenKey(id))||'[]')}catch(_){}seen=new Set(Array.isArray(stored)?stored:[]);if(!seen.size)events.forEach(e=>seen.add(e.id));saveSeen();return}
    events.forEach(ev=>{if(seen.has(ev.id))return;seen.add(ev.id);queueFx(ev)});saveSeen();
  }
  function saveSeen(){try{localStorage.setItem(seenKey(eventSession),JSON.stringify(Array.from(seen).slice(-120)))}catch(_){}}
  function tick(){
    if(!state||!state.session)return;if(!urgentView()&&Date.now()>=phase.endsAt)advance();
    const pc=document.getElementById('phase-clock');if(pc)pc.textContent=clock(phaseSeconds());
    const lc=document.getElementById('live-clock');if(lc)lc.textContent=clock(liveSeconds());
  }
  async function refresh(){if(!api||!api.backendUrl){app.innerHTML='';return}try{const next=await api.state();detectEvents(next);const old=state&&state.session?state.session.session_id:'';state=next;if(!state.session||state.session.session_id!==old)phaseStarted=false;render(false)}catch(e){console.warn('Overlay indisponível:',e)}}
  refresh();setInterval(refresh,REFRESH_MS);setInterval(tick,1000);
})();
</script>
