      <form class="livepix-form" id="livepix-form">
        <label class="sr-only" for="support-name">Seu nome</label>
        <input id="support-name" name="name" class="field field-name" maxlength="60" autocomplete="nickname" placeholder="Como você quer aparecer?" />
        <label class="sr-only" for="support-amount">Valor</label>
        <input id="support-amount" name="amount" class="field field-amount" inputmode="decimal" placeholder="10,00" />
        <label class="sr-only" for="support-message">Mensagem</label>
        <textarea id="support-message" name="message" class="field field-message" maxlength="300" placeholder="Manda um salve, uma mensagem ou o que quiser! ♡"></textarea>

        <button class="quick q5" type="button" data-value="5" aria-label="R$ 5"></button>
        <button class="quick q10" type="button" data-value="10" aria-label="R$ 10"></button>
        <button class="quick q20" type="button" data-value="20" aria-label="R$ 20"></button>
        <button class="quick q50" type="button" data-value="50" aria-label="R$ 50"></button>

        <button class="pix-submit" type="submit" aria-label="Enviar via LivePix"></button>
      </form>

      <a class="hotspot pix-tab tab-message" href="#apoiar" aria-label="Enviar mensagem"></a>
      <a class="hotspot pix-tab tab-fast" href="https://livepix.gg/justguh" target="_blank" rel="noreferrer" aria-label="Pix rápido"></a>
